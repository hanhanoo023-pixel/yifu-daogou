intent_groups:
  discovery: [RECOMMEND_PRODUCT, BROWSE_PRODUCT, REQUEST_ALTERNATIVE, REFINE_FILTERS, OUTFIT_ADVICE]
  external_data: [ASK_TREND, SEARCH_EXTERNAL_PRODUCT, ASK_NEW_ARRIVAL]
  product_question: [VIEW_PRODUCT, EXPLAIN_PRODUCT, ASK_PRICE, ASK_MATERIAL, ASK_STOCK, ASK_SIZE, ASK_COLOR, ASK_BRAND, ASK_CARE, ASK_STYLE, ASK_OCCASION]
  comparison: [COMPARE_PRODUCTS]
