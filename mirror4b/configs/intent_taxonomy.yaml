  - sleeve_length
  - garment_length
  - neckline
  - occasions
  - style_preferences
  - body_goals
  - weather
  - excluded_categories
  - excluded_colors
  - excluded_materials
  - excluded_brands
  - excluded_styles
  - negative_colors
  - excluded_product_ids

