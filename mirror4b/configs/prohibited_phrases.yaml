phrases:
  - pattern: "全网最低"
    code: "UNSUPPORTED_LOWEST_PRICE"
    severity: "HIGH"
    message: "缺少全网价格证据"
  - pattern: "只剩最后一件|最后一件|仅剩一件"
    code: "UNSUPPORTED_SCARCITY"
    severity: "HIGH"
    message: "缺少真实稀缺库存证据"
  - pattern: "绝对显瘦|保证显瘦|保证好看|一定适合"
    code: "ABSOLUTE_EFFECT_CLAIM"
    severity: "MEDIUM"
    message: "不允许绝对化穿着效果承诺"
  - pattern: "你的肩太宽|你的腿太粗|你太胖"
    code: "INAPPROPRIATE_BODY_JUDGMENT"
    severity: "HIGH"
    message: "不允许不当身体评价"
